<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Set &mdash; Variables, Stimulus &amp; Response, Type of Learning</title>
<style>
  :root{
    --ink:#1b1b1b;
    --muted:#6d6d6d;
    --red:#A3282F;
    --green:#1c6b3f;
    --amber:#8a5a00;
    --line:#d6d6d6;
    --panel:#f4f2f2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;}
  button,input,textarea{font-family:inherit;}

  header{padding:14px 34px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  header h1{margin:0;font-size:1.05rem;font-weight:700;}

  .levels{display:flex;border:2px solid var(--line);border-radius:5px;overflow:hidden;}
  .lvl{padding:7px 14px;font-size:.88rem;font-weight:600;border:0;background:#fff;
    color:var(--muted);cursor:pointer;border-right:1px solid var(--line);}
  .lvl:last-child{border-right:0;}
  .lvl.on{background:var(--ink);color:#fff;}
  .lvlnote{font-size:.85rem;color:var(--muted);}

  .dots{margin-left:auto;display:flex;gap:8px;}
  .dot{width:29px;height:29px;border-radius:50%;border:2px solid var(--line);background:#fff;
    color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer;padding:0;}
  .dot:hover{border-color:var(--red);color:var(--red);}
  .dot.active{background:var(--red);border-color:var(--red);color:#fff;}
  .dot.done{border-color:var(--red);color:var(--red);}

  main{flex:1;padding:20px 34px 8px;display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;}
  @media (max-width:1080px){ main{grid-template-columns:1fr;} }

  .scen{background:var(--panel);padding:18px 22px;border-radius:4px;}
  .scen .num{font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--red);margin-bottom:8px;}
  .scen p{margin:0;font-size:1.2rem;line-height:1.52;}

  .studybtn{margin-top:12px;}
  .study{margin-top:12px;border-left:4px solid var(--ink);background:#fff;padding:13px 17px;display:none;}
  .study.show{display:block;}
  .study .cite{font-size:.97rem;line-height:1.45;margin-bottom:9px;}
  .study .found{font-size:1.01rem;line-height:1.5;}
  .study .found b{color:var(--red);}

  .work h2{font-size:.82rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px;}

  .bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:44px;}
  .chip{padding:9px 14px;font-size:1rem;border:2px solid var(--line);border-radius:20px;
    background:#fff;color:var(--ink);cursor:pointer;line-height:1.25;text-align:left;}
  .chip:hover{border-color:var(--red);}
  .chip.sel{background:var(--ink);border-color:var(--ink);color:#fff;}

  .slots,.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .slot,.card{border:2px solid var(--line);border-radius:4px;padding:12px 15px;min-height:96px;
    background:#fff;cursor:pointer;text-align:left;width:100%;display:block;}
  .slot{border-style:dashed;}
  .slot:hover,.card:hover{border-color:var(--red);}
  .lab{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;display:block;}
  .fill,.val{font-size:1.05rem;line-height:1.35;color:#a9a9a9;font-style:italic;display:block;}
  .slot.filled{border-style:solid;}
  .slot.filled .fill,.card.on .val{color:var(--ink);font-style:normal;}
  .card.on{border-color:var(--red);}
  .card.on .lab{color:var(--red);}
  .slot.ok{border-color:var(--green);background:#eef6f1;}
  .slot.ok .lab{color:var(--green);}
  .slot.no{border-color:var(--red);background:#fbf1f1;}
  .slot.no .lab{color:var(--red);}

  /* write level */
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .field{border:2px solid var(--line);border-radius:4px;padding:11px 13px;background:#fff;}
  .field textarea{width:100%;border:0;outline:0;resize:none;font-size:1.02rem;line-height:1.35;
    color:var(--ink);background:transparent;min-height:52px;}
  .field textarea::placeholder{color:#b6b6b6;font-style:italic;}
  .verdict{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;padding:2px 8px;border-radius:11px;margin-left:8px;vertical-align:2px;}
  .v-yes{background:#eef6f1;color:var(--green);}
  .v-close{background:#fdf6e7;color:var(--amber);}
  .v-no{background:#fbf1f1;color:var(--red);}
  .model{font-size:.96rem;line-height:1.4;color:var(--muted);margin-top:8px;
    padding-top:8px;border-top:1px dotted var(--line);display:none;}
  .model.show{display:block;}
  .model b{color:var(--ink);}
  .field.yes{border-color:var(--green);}
  .field.close{border-color:#d9a441;}
  .field.no{border-color:var(--red);}

  .cold ol{margin:0 0 14px;padding-left:24px;font-size:1.1rem;line-height:1.7;}
  .coldans{display:none;}
  .coldans.show{display:block;}
  .coldans div{font-size:1.06rem;line-height:1.5;margin-bottom:9px;}
  .coldans b{color:var(--red);}

  .typeq{margin-top:18px;border-top:1px solid var(--line);padding-top:15px;}
  .typeq .q{font-size:1.1rem;font-weight:700;margin-bottom:10px;}
  .choices{display:flex;gap:9px;}
  .choice{flex:1;padding:12px 8px;font-size:1.05rem;font-weight:600;border:2px solid var(--line);
    border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;}
  .choice:hover:not(:disabled){border-color:var(--red);}
  .choice:disabled{cursor:default;}
  .choice.correct{border-color:var(--green);background:#eef6f1;color:var(--green);}
  .choice.wrong{border-color:#c4c4c4;background:#f5f5f5;color:#9a9a9a;text-decoration:line-through;}

  .why{margin-top:12px;padding:12px 16px;border-left:4px solid var(--red);background:#faf7f7;
    font-size:1.01rem;line-height:1.5;display:none;}
  .why.show{display:block;}

  footer{padding:12px 34px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;}
  .btn{padding:10px 19px;font-size:.95rem;font-weight:600;border:2px solid var(--ink);
    border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;}
  .btn:hover:not(:disabled){background:var(--ink);color:#fff;}
  .btn:disabled{opacity:.3;cursor:default;}
  .btn.primary{border-color:var(--red);color:var(--red);}
  .btn.primary:hover:not(:disabled){background:var(--red);color:#fff;}
  .spacer{flex:1;}
</style>
</head>
<body>

<header>
  <h1>Learning &amp; Memory</h1>
  <div class="levels" id="levels">
    <button class="lvl" data-l="match">Match</button>
    <button class="lvl on" data-l="reveal">Reveal</button>
    <button class="lvl" data-l="write">Write</button>
    <button class="lvl" data-l="cold">Cold call</button>
  </div>
  <span class="lvlnote" id="lvlnote"></span>
  <div class="dots" id="dots"></div>
</header>

<main>
  <section>
    <div class="scen">
      <div class="num" id="sNum"></div>
      <p id="sText"></p>
    </div>
    <button class="btn studybtn" id="studyBtn">Show the study</button>
    <div class="study" id="study">
      <div class="cite" id="sCite"></div>
      <div class="found" id="sFound"></div>
    </div>
  </section>

  <section class="work">
    <h2 id="workHead"></h2>
    <div id="workArea"></div>
    <div class="typeq">
      <div class="q">Classical conditioning, operant conditioning, or neither?</div>
      <div class="choices" id="choices">
        <button class="choice" data-t="classical">Classical</button>
        <button class="choice" data-t="operant">Operant</button>
        <button class="choice" data-t="neither">Neither</button>
      </div>
      <div class="why" id="why"></div>
    </div>
  </section>
</main>

<footer>
  <button class="btn" id="prev">&larr; Previous</button>
  <button class="btn primary" id="action">Check answers</button>
  <button class="btn" id="reset">Reset this one</button>
  <span class="spacer"></span>
  <button class="btn" id="next">Next &rarr;</button>
</footer>

const VERDICT={yes:["Yes","v-yes"],close:["Close","v-close"],no:["Not yet","v-no"]};

let level="reveal", idx=0, sel=null;

const state=DATA.map(blank);

const esc=t=>{const d=document.createElement("div");d.textContent=t;return d.innerHTML;};

function grade(text,groups){
  const t=(text||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  if(!t) return null;
  let hits=0;
  groups.forEach(g=>{ if(g.some(k=>new RegExp("\\b"+k).test(t))) hits++; });
  const r=hits/groups.length;
  return r>=1?"yes":(r>=0.5?"close":"no");
}

  b.className="dot"; b.textContent=i+1; b.title=d.title;
  b.onclick=()=>{idx=i;sel=null;render();};
  el("dots").appendChild(b);
});

document.querySelectorAll(".lvl").forEach(b=>{
  b.onclick=()=>{
    level=b.dataset.l; sel=null;
    for(let i=0;i<state.length;i++){ const keep=state[i].studyOpen; state[i]=blank(); state[i].studyOpen=keep; }
    render();
  };
});

function render(){
  const d=DATA[idx], s=state[idx];

  document.querySelectorAll(".lvl").forEach(b=>b.classList.toggle("on",b.dataset.l===level));
  el("lvlnote").textContent=LVLNOTE[level];

  el("sNum").textContent="Scenario "+(idx+1)+" \u00b7 "+d.title;
  el("sText").textContent=d.text;
  el("study").classList.toggle("show",s.studyOpen);
  el("studyBtn").textContent=s.studyOpen?"Hide the study":"Show the study";
  el("sCite").innerHTML=d.cite;
  el("sFound").innerHTML=d.found;

  const area=el("workArea");
  area.innerHTML="";

  if(level==="match"){
    el("workHead").textContent="Place each phrase";
    const bank=document.createElement("div");
    bank.className="bank";
    const used=new Set(Object.values(s.placed));
    d.chips.forEach(c=>{
      if(used.has(c.id))return;
      const b=document.createElement("button");
      b.className="chip"+(sel===c.id?" sel":"");
      b.textContent=c.label;
      b.draggable=true;
      b.ondragstart=e=>{e.dataTransfer.setData("text/plain",c.id);};
      b.onclick=()=>{sel=(sel===c.id?null:c.id);render();};
      bank.appendChild(b);
    });
    area.appendChild(bank);

    const grid=document.createElement("div");
    grid.className="slots";
    SLOTS.forEach(([k,label])=>{
      const chip=s.placed[k]?d.chips.find(c=>c.id===s.placed[k]):null;
      const b=document.createElement("button");
      let cls="slot"+(chip?" filled":"");
      if(s.checked&&chip) cls+=(chip.slot===k?" ok":" no");
      b.className=cls;
      b.innerHTML='<span class="lab">'+label+'</span><span class="fill">'+(chip?esc(chip.label):"empty")+'</span>';
      b.ondragover=e=>e.preventDefault();
      b.ondrop=e=>{
        e.preventDefault();
        const id=e.dataTransfer.getData("text/plain");
        for(const kk in s.placed) if(s.placed[kk]===id) delete s.placed[kk];
        s.placed[k]=id; sel=null; s.checked=false; render();
      };
      b.onclick=()=>{
        if(sel){
          for(const kk in s.placed) if(s.placed[kk]===sel) delete s.placed[kk];
          s.placed[k]=sel; sel=null;
        } else if(chip){ delete s.placed[k]; }
        s.checked=false; render();
      };
      grid.appendChild(b);
    });
    area.appendChild(grid);

    if(s.checked){
      const n=document.createElement("div");
      n.className="why show";
      const misplaced=d.chips.filter(c=>{
        const k=Object.keys(s.placed).find(kk=>s.placed[kk]===c.id);
        return k&&c.slot!==k;
      });
      if(Object.keys(s.placed).length<4){
        n.innerHTML="Fill all four boxes, then check again.";
      } else if(misplaced.length===0){
        const left=d.chips.filter(c=>!Object.values(s.placed).includes(c.id));
        n.innerHTML="All four correct. Still in the bank: "+
          left.map(c=>"<b>"+esc(c.label)+"</b>").join(", ")+".";
      } else {
        n.innerHTML=misplaced.map(c=>"<b>"+esc(c.label)+"</b> \u2014 "+
          esc(c.note||"belongs in a different box.")).join("<br>");
      }
      area.appendChild(n);
    }
  }

  else if(level==="reveal"){
    el("workHead").textContent="Tap to reveal";
    const grid=document.createElement("div");
    grid.className="cards";
    SLOTS.forEach(([k,label])=>{
      const b=document.createElement("button");
      b.className="card"+(s.revealed[k]?" on":"");
      b.innerHTML='<span class="lab">'+label+'</span><span class="val">'+
        (s.revealed[k]?esc(d.slots[k]):"tap to reveal")+'</span>';
      b.onclick=()=>{s.revealed[k]=!s.revealed[k];render();};
      grid.appendChild(b);
    });
    area.appendChild(grid);
  }

  else if(level==="write"){
    el("workHead").textContent="Type an answer for each";
    const grid=document.createElement("div");
    grid.className="fields";
    SLOTS.forEach(([k,label])=>{
      const v=s.graded?grade(s.typed[k],d.keys[k]):null;
      const wrap=document.createElement("div");
      wrap.className="field"+(v?" "+v:"");
      const lab=document.createElement("span");
      lab.className="lab";
      lab.innerHTML=label+(v?'<span class="verdict '+VERDICT[v][1]+'">'+VERDICT[v][0]+'</span>':"");
      const ta=document.createElement("textarea");
      ta.rows=2;
      ta.placeholder="type here";
      ta.value=s.typed[k]||"";
      ta.oninput=e=>{ s.typed[k]=e.target.value; };
      const mod=document.createElement("div");
      mod.className="model"+(s.graded?" show":"");
      mod.innerHTML="<b>"+esc(d.slots[k])+"</b>";
      wrap.appendChild(lab); wrap.appendChild(ta); wrap.appendChild(mod);
      grid.appendChild(wrap);
    });
    area.appendChild(grid);
    if(s.graded){
      const n=document.createElement("div");
      n.className="why show";
      n.innerHTML="Matching is by keyword, so a right answer worded oddly can read as Close. The model answer is the arbiter, not the badge.";
      area.appendChild(n);
    }
  }

  else {
    el("workHead").textContent="Work all four before revealing";
    const w=document.createElement("div");
    w.className="cold";
    w.innerHTML="<ol><li>What is the independent variable?</li><li>What is the dependent variable?</li>"+
      "<li>What is the stimulus? What is the response?</li>"+
      "<li>Classical, operant, or neither, and why?</li></ol>"+
      '<div class="coldans'+(s.coldOpen?" show":"")+'">'+
      SLOTS.map(([k,label])=>"<div><b>"+label+":</b> "+esc(d.slots[k])+"</div>").join("")+"</div>";
    area.appendChild(w);
  }

  document.querySelectorAll(".choice").forEach(b=>{
    b.classList.remove("correct","wrong");
    b.disabled=s.typeDone;
    if(s.typeDone) b.classList.add(b.dataset.t===d.type?"correct":"wrong");
  });
  const why=el("why");
  why.classList.toggle("show",s.typeDone);
  why.innerHTML=s.typeDone?esc(d.why):"";

  document.querySelectorAll(".dot").forEach((b,i)=>{
    const st=state[i];
    b.classList.toggle("active",i===idx);
    b.classList.toggle("done",i!==idx&&(st.typeDone||st.checked||st.graded||st.coldOpen||
      Object.keys(st.revealed).length>0||Object.keys(st.placed).length>0));
  });

  el("prev").disabled=idx===0;
  el("next").disabled=idx===DATA.length-1;
  el("action").textContent=(level==="match"||level==="write")?"Check answers":"Reveal all four";
}

document.querySelectorAll(".choice").forEach(b=>{
  b.onclick=()=>{state[idx].typeDone=true;render();};
});
el("prev").onclick=()=>{if(idx>0){idx--;sel=null;render();}};
el("next").onclick=()=>{if(idx<DATA.length-1){idx++;sel=null;render();}};
el("studyBtn").onclick=()=>{state[idx].studyOpen=!state[idx].studyOpen;render();};
el("reset").onclick=()=>{ state[idx]=blank(); sel=null; render(); };
el("action").onclick=()=>{
  const s=state[idx];
  if(level==="match") s.checked=true;
  else if(level==="write") s.graded=true;
  else if(level==="cold") s.coldOpen=true;
  else SLOTS.forEach(([k])=>s.revealed[k]=true);
  render();
};

render();
</script>
</body>
</html>
